name: Propose upstream PipePipe updates

on:
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-pipepipe-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream and pin the client fork
        id: merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/InfinityLoop1308/PipePipe.git
          git fetch upstream main
          git switch -C sync/upstream-main
          if ! git merge --no-edit upstream/main; then
            for path in .gitmodules PipePipeClient PipePipeExtractor; do
              if [ -n "$(git ls-files -u -- "$path")" ]; then
                if [ "$path" = PipePipeExtractor ]; then
                  git checkout --theirs -- "$path"
                else
                  git checkout --ours -- "$path"
                fi
                git add -- "$path"
              fi
            done
            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              echo 'Unresolved upstream merge conflict; review manually.' >&2
              exit 1
            fi
            git commit --no-edit
          fi
          git config -f .gitmodules submodule.PipePipeClient.url \
            https://github.com/twiclo/PipePipeClient-WL.git
          git config -f .gitmodules submodule.PipePipeExtractor.url \
            https://github.com/InfinityLoop1308/PipePipeExtractor.git
          git config -f .gitmodules --remove-section submodule.NewPipeEnhanced-client || true
          git config -f .gitmodules --remove-section submodule.NewPipeExtractor || true
          client_sha=$(git ls-remote https://github.com/twiclo/PipePipeClient-WL.git refs/heads/dev | cut -f1)
          test -n "$client_sha"
          git update-index --add --cacheinfo "160000,$client_sha,PipePipeClient"
          git add .gitmodules
          if ! git diff --cached --quiet; then
            git commit -m 'Pin current Watch Later client and extractor'
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 25
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build proposed update
        if: steps.merge.outputs.changed == 'true'
        run: |
          git submodule sync
          git submodule update --init PipePipeClient PipePipeExtractor
          cd PipePipeClient
          ./gradlew :app:assembleDebug --console=plain

      - name: Push proposal branch
        if: steps.merge.outputs.changed == 'true'
        run: git push --force origin HEAD:refs/heads/sync/upstream-main

      - name: Open review pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh pr list --head sync/upstream-main --base main --state open --json number --jq 'length')" = 0 ]; then
            gh pr create --head sync/upstream-main --base main \
              --title 'Merge upstream PipePipe changes' \
              --body 'The Watch Later client pointer has been preserved and the debug APK builds. Review and merge this update to publish a new signed release.'
          fi
